    <script>

        async function loadKatalog() {

            try {

                const response = await fetch(
                    "http://localhost:3003/graphql",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            query: `
                            query {
                                getAllKatalog {
                                    id_katalog
                                    nama_layanan
                                    nama_stylist
                                    harga
                                    status
                                }
                            }
                            `
                        })
                    }
                );

                const result = await response.json();

                const katalog = result.data.getAllKatalog;

                const container =
                    document.getElementById("katalog-container");

                container.innerHTML = "";

                katalog.forEach(item => {

                    container.innerHTML += `

                    <div
                        class="overflow-hidden rounded-xl bg-[#9d8d8a] text-[#504442] shadow-lg hover:scale-105 transition duration-300">

                        <img
                            src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?w=800"
                            alt="${item.nama_layanan}"
                            class="w-full h-60 object-cover">

                        <div class="p-5">

                            <div class="flex justify-between items-center mb-3">

                                <h3 class="text-xl font-bold">
                                    ${item.nama_layanan}
                                </h3>

                                <span class="font-bold">
                                    Rp ${Number(item.harga).toLocaleString('id-ID')}
                                </span>

                            </div>

                            <p class="mb-4">
                                Status : ${item.status}
                            </p>

                            <div class="border-t border-[#1d100d] pt-3 text-sm">
                                stylist :
                                ${item.nama_stylist}
                            </div>

                        </div>

                    </div>

                    `;
                });

            } catch (error) {

                console.error(error);

                document.getElementById(
                    "katalog-container"
                ).innerHTML = `
                    <div class="text-red-500">
                        Gagal mengambil data katalog
                    </div>
                `;
            }
        }

        loadKatalog();

        let allKatalog = [];

const searchInput = document.getElementById("search");
const container = document.getElementById("katalog-container");

// ambil data + simpan global
async function loadKatalog() {
    try {
        const response = await fetch("http://localhost:3003/graphql", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                query: `
                query {
                    getAllKatalog {
                        id_katalog
                        nama_layanan
                        nama_stylist
                        harga
                        status
                    }
                }
                `
            })
        });

        const result = await response.json();
        allKatalog = result.data.getAllKatalog;

        renderKatalog(allKatalog);

    } catch (error) {
        console.error(error);
        container.innerHTML = `
            <div class="text-red-500">
                Gagal mengambil data katalog
            </div>
        `;
    }
}

// fungsi render
function renderKatalog(data) {
    container.innerHTML = "";

    data.forEach(item => {
        container.innerHTML += `
        <div class="overflow-hidden rounded-xl bg-[#9d8d8a] text-[#504442] shadow-lg hover:scale-105 transition duration-300">

            <img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?w=800"
                class="w-full h-60 object-cover">

            <div class="p-5">

                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xl font-bold">
                        ${item.nama_layanan}
                    </h3>

                    <span class="font-bold">
                        Rp ${Number(item.harga).toLocaleString('id-ID')}
                    </span>
                </div>

                <p class="mb-4">
                    Status : ${item.status}
                </p>

                <div class="border-t border-[#1d100d] pt-3 text-sm">
                    stylist : ${item.nama_stylist}
                </div>

            </div>
        </div>
        `;
    });
}

// search filter
searchInput.addEventListener("input", function () {
    const filtered = allKatalog.filter(item => {
    const layanan = (item.nama_layanan || "").toLowerCase();
    const stylist = (item.nama_stylist || "").toLowerCase();
    const status = (item.status || "").toLowerCase();
    const keyword = this.value.toLowerCase();

    return (
        layanan.includes(keyword) ||
        stylist.includes(keyword) ||
        status.includes(keyword)
    );
});

    renderKatalog(filtered);
});

loadKatalog();
